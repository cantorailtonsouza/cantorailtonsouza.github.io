name: Add Home Discografia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-home-discografia.yml'

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert discography section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="discografia"' not in s:
              css = r'''

        /* Discografia — destaques da Home */
        #discografia {
            padding: 90px 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(197,161,90,.10), transparent 34%),
                linear-gradient(180deg, #0b0b0b 0%, #111 100%);
            border-top: 1px solid rgba(197,161,90,.12);
            border-bottom: 1px solid rgba(197,161,90,.12);
        }
        .discografia-cabecalho { text-align:center; margin-bottom:42px; }
        .discografia-kicker { color:var(--color-accent-gold); text-transform:uppercase; letter-spacing:.18em; font-weight:700; font-size:.78rem; }
        .discografia-cabecalho h2 { font-family:var(--font-headings); font-size:clamp(2.4rem,5vw,4rem); margin:8px 0 10px; }
        .discografia-cabecalho p { max-width:720px; margin:0 auto; color:rgba(247,243,237,.68); }
        .discografia-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
        .discografia-card { overflow:hidden; border-radius:18px; background:linear-gradient(180deg,#181818,#101010); border:1px solid rgba(197,161,90,.28); box-shadow:0 18px 48px rgba(0,0,0,.32); transition:.3s ease; }
        .discografia-card:hover { transform:translateY(-6px); border-color:rgba(197,161,90,.7); box-shadow:0 24px 58px rgba(0,0,0,.42); }
        .discografia-card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; transition:transform .45s ease; }
        .discografia-card:hover img { transform:scale(1.025); }
        .discografia-info { padding:20px; }
        .discografia-info small { color:var(--color-accent-gold); text-transform:uppercase; letter-spacing:.13em; font-weight:700; }
        .discografia-info h3 { font-family:var(--font-headings); font-size:1.55rem; margin:7px 0 3px; line-height:1.15; }
        .discografia-info p { color:rgba(247,243,237,.55); font-size:.9rem; margin:0; }
        .discografia-acao { text-align:center; margin-top:34px; }
        .discografia-btn { display:inline-flex; align-items:center; gap:10px; color:var(--color-accent-gold); border:1.5px solid var(--color-accent-gold); padding:14px 24px; border-radius:8px; text-decoration:none; font-weight:700; text-transform:uppercase; letter-spacing:.08em; transition:.25s ease; }
        .discografia-btn:hover { background:var(--color-accent-gold); color:#090909; transform:translateY(-2px); }
        @media(max-width:820px){ .discografia-grid{grid-template-columns:1fr; max-width:520px; margin:0 auto;} #discografia{padding:70px 0;} }
'''
              s = s.replace('</style>', css + '\n    </style>', 1)
              section = r'''

        <section id="discografia" class="reveal-section">
            <div class="container">
                <div class="discografia-cabecalho">
                    <span class="discografia-kicker">Minha música</span>
                    <h2>Discografia</h2>
                    <p>Conheça alguns dos lançamentos que fazem parte da trajetória de Ailton Souza.</p>
                </div>
                <div class="discografia-grid">
                    <article class="discografia-card">
                        <img src="images/discografia/quando-chega-ao-fim.webp" alt="Capa de Quando Chega ao Fim, de Ailton Souza" loading="lazy">
                        <div class="discografia-info"><small>Lançamento</small><h3>Quando Chega ao Fim</h3><p>Ailton Souza</p></div>
                    </article>
                    <article class="discografia-card">
                        <img src="images/discografia/na-rua-de-casa.webp" alt="Capa de Acústico Na Rua de Casa, de Ailton Souza" loading="lazy">
                        <div class="discografia-info"><small>Projeto ao vivo</small><h3>Acústico Na Rua de Casa</h3><p>Ao vivo em Luziânia, Goiás.</p></div>
                    </article>
                    <article class="discografia-card">
                        <img src="images/discografia/veio-milionario.webp" alt="Capa de Véio Milionário, de Ailton Souza" loading="lazy">
                        <div class="discografia-info"><small>Lançamento</small><h3>Véio Milionário</h3><p>Ailton Souza</p></div>
                    </article>
                </div>
                <div class="discografia-acao"><a class="discografia-btn" href="/discografia/">Ver discografia completa <span aria-hidden="true">→</span></a></div>
            </div>
        </section>
'''
              marker = '<section id="contratante">'
              if marker in s:
                  s = s.replace(marker, section + '\n        ' + marker, 1)
              else:
                  raise SystemExit('Marker contratante not found')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/add-home-discografia.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-home-discografia.yml
          git commit -m "Add discography highlights to home" || exit 0
          git push
