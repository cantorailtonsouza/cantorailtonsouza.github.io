name: Atualizar biografia uma vez

on:
  push:
    paths:
      - '.github/workflows/update-bio-once.yml'

permissions:
  contents: write

jobs:
  update-bio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar texto da trajetória
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          data = path.read_bytes()

          replacements = [
              (
                  '                            Ailton Souza é cantor sertanejo em Luziânia, com atuação em Brasília,\r\n                            Goiás e Distrito Federal. Com uma trajetória construída nos palcos e uma conexão\r\n                            verdadeira com o público, transforma cada apresentação em um momento único.',
                  '                            Ailton Souza é cantor sertanejo em Luziânia, com atuação em Brasília,\r\n                            Goiás e Distrito Federal. Canta desde os 13 anos e iniciou sua trajetória profissional\r\n                            nos bares entre 2014 e 2015. Com uma conexão verdadeira com o público, transforma cada apresentação em um momento único.'
              ),
              (
                  '                                    <strong>+13 anos</strong>\r\n                                    <span>de carreira</span>',
                  '                                    <strong>Desde os 13 anos</strong>\r\n                                    <span>vivendo a música</span>'
              ),
              (
                  '                        <strong class="counter" data-target="13" data-suffix="+">0</strong>\r\n                        <span>Anos de carreira</span>',
                  '                        <strong class="counter" data-target="13" data-suffix=" anos">0</strong>\r\n                        <span>quando começou a cantar</span>'
              ),
          ]

          for old, new in replacements:
              old_b = old.encode('utf-8')
              new_b = new.encode('utf-8')
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f'Replacement expected once, found {count}: {old[:80]!r}')
              data = data.replace(old_b, new_b, 1)

          path.write_bytes(data)
          PY

      - name: Commit da atualização e limpeza
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-bio-once.yml
          git add index.html
          git commit -m "Atualiza trajetória artística de Ailton Souza"
          git push
