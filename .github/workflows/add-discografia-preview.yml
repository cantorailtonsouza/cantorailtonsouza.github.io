name: Add discography preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-discografia-preview.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add discography section and page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          css = r'''

        /* =========================
           DISCOGRAFIA — PRÉVIA
           ========================= */
        .discografia-preview {
            padding: 88px 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(197,161,90,.11), transparent 34%),
                linear-gradient(180deg, #0b0b0b 0%, #111 100%);
            border-top: 1px solid rgba(197,161,90,.12);
            border-bottom: 1px solid rgba(197,161,90,.12);
        }
        .discografia-preview .discografia-cabecalho {
            text-align: center;
            max-width: 760px;
            margin: 0 auto 42px;
        }
        .discografia-preview .discografia-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--color-accent-gold);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .22em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .discografia-preview h2 {
            font-family: var(--font-headings);
            font-size: clamp(2.4rem, 5vw, 4rem);
            line-height: 1.02;
            margin-bottom: 14px;
        }
        .discografia-preview .discografia-intro {
            color: rgba(247,243,237,.72);
            font-size: 1rem;
        }
        .discografia-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }
        .discografia-card {
            background: linear-gradient(180deg, rgba(24,24,24,.92), rgba(12,12,12,.96));
            border: 1px solid rgba(197,161,90,.28);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(0,0,0,.28);
            transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
        }
        .discografia-card:hover {
            transform: translateY(-6px);
            border-color: rgba(197,161,90,.72);
            box-shadow: 0 24px 60px rgba(0,0,0,.40), 0 0 26px rgba(197,161,90,.08);
        }
        .discografia-capa {
            aspect-ratio: 1 / 1;
            width: 100%;
            display: block;
            object-fit: cover;
            background: #111;
        }
        .discografia-card-body {
            padding: 22px;
        }
        .discografia-card-body small {
            display: block;
            color: var(--color-accent-gold);
            text-transform: uppercase;
            letter-spacing: .16em;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .discografia-card-body h3 {
            font-family: var(--font-headings);
            font-size: 1.45rem;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .discografia-card-body p {
            color: rgba(247,243,237,.62);
            font-size: .9rem;
        }
        .discografia-acoes {
            text-align: center;
            margin-top: 34px;
        }
        .discografia-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 52px;
            padding: 0 26px;
            border-radius: 10px;
            border: 1px solid var(--color-accent-gold);
            color: var(--color-accent-gold);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: .3s ease;
        }
        .discografia-btn:hover {
            background: var(--color-accent-gold);
            color: #090909;
            transform: translateY(-2px);
        }
        .discografia-aviso {
            margin-top: 18px;
            color: rgba(247,243,237,.42);
            font-size: .78rem;
            text-align: center;
        }
        @media (max-width: 820px) {
            .discografia-preview { padding: 66px 0; }
            .discografia-grid { grid-template-columns: 1fr; gap: 18px; }
            .discografia-card { max-width: 520px; margin: 0 auto; width: 100%; }
        }
'''

          section = r'''

        <section id="discografia" class="discografia-preview reveal-section">
            <div class="container">
                <div class="discografia-cabecalho">
                    <span class="discografia-kicker"><i class="fas fa-compact-disc"></i> Minha música</span>
                    <h2>Discografia</h2>
                    <p class="discografia-intro">Alguns dos lançamentos que fazem parte da história de Ailton Souza.</p>
                </div>

                <div class="discografia-grid">
                    <article class="discografia-card">
                        <img class="discografia-capa" src="images/discografia-quando-chega-o-fim.svg" alt="Capa provisória de Quando Chega o Fim" loading="lazy">
                        <div class="discografia-card-body">
                            <small>Prévia visual</small>
                            <h3>Quando Chega o Fim</h3>
                            <p>Capa provisória para visualização da nova seção.</p>
                        </div>
                    </article>

                    <article class="discografia-card">
                        <img class="discografia-capa" src="images/discografia-na-rua-de-casa.svg" alt="Capa provisória de Na Rua de Casa" loading="lazy">
                        <div class="discografia-card-body">
                            <small>Prévia visual</small>
                            <h3>Na Rua de Casa</h3>
                            <p>Capa provisória para visualização da nova seção.</p>
                        </div>
                    </article>

                    <article class="discografia-card">
                        <img class="discografia-capa" src="images/discografia-solidao.svg" alt="Capa provisória de Solidão" loading="lazy">
                        <div class="discografia-card-body">
                            <small>Prévia visual</small>
                            <h3>Solidão</h3>
                            <p>Capa provisória para visualização da nova seção.</p>
                        </div>
                    </article>
                </div>

                <div class="discografia-acoes">
                    <a class="discografia-btn" href="/discografia/">Ver discografia completa <i class="fas fa-arrow-right"></i></a>
                </div>
                <p class="discografia-aviso">Capas temporárias apenas para aprovação visual.</p>
            </div>
        </section>
'''

          if 'id="discografia"' not in html:
              if '</style>' not in html:
                  raise SystemExit('Não encontrei </style> no index.html')
              html = html.replace('</style>', css + '\n    </style>', 1)
              anchor = '        <section id="contratante">'
              if anchor not in html:
                  raise SystemExit('Não encontrei a seção Contratante no index.html')
              html = html.replace(anchor, section + '\n\n' + anchor, 1)
              index.write_text(html, encoding='utf-8')

          Path('images').mkdir(exist_ok=True)
          covers = {
              'images/discografia-quando-chega-o-fim.svg': ('QUANDO CHEGA', 'O FIM', '#8b1e2d', '#d6a84f'),
              'images/discografia-na-rua-de-casa.svg': ('NA RUA', 'DE CASA', '#1a1a1a', '#c5a15a'),
              'images/discografia-solidao.svg': ('SOLIDÃO', 'AILTON SOUZA', '#18243a', '#d5b46a'),
          }
          for path, (line1, line2, c1, c2) in covers.items():
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
          <defs>
            <radialGradient id="g" cx="35%" cy="25%" r="90%"><stop offset="0" stop-color="{c1}"/><stop offset="1" stop-color="#050505"/></radialGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1200" height="1200" fill="url(#g)"/>
          <circle cx="920" cy="255" r="240" fill="none" stroke="{c2}" stroke-opacity=".23" stroke-width="3"/>
          <circle cx="920" cy="255" r="175" fill="none" stroke="{c2}" stroke-opacity=".14" stroke-width="2"/>
          <path d="M0 860 C240 720 380 1010 640 830 S1000 670 1200 805 V1200 H0Z" fill="#000" fill-opacity=".55"/>
          <text x="90" y="820" fill="{c2}" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="8">AILTON SOUZA</text>
          <text x="90" y="935" fill="#fff" font-family="Georgia,serif" font-size="105" font-weight="700">{line1}</text>
          <text x="90" y="1048" fill="{c2}" font-family="Georgia,serif" font-size="105" font-weight="700" filter="url(#glow)">{line2}</text>
          <text x="90" y="1125" fill="#fff" fill-opacity=".55" font-family="Arial,Helvetica,sans-serif" font-size="28" letter-spacing="6">CAPA PROVISÓRIA</text>
          </svg>'''
              Path(path).write_text(svg, encoding='utf-8')

          Path('discografia').mkdir(exist_ok=True)
          page = '''<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discografia | Ailton Souza</title>
<meta name="description" content="Discografia de Ailton Souza: músicas, álbuns, singles e lançamentos.">
<link rel="canonical" href="https://ailtonsouza.com.br/discografia/">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--surface:#151515;--gold:#c5a15a;--text:#f7f3ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(197,161,90,.12),transparent 30%),var(--bg);color:var(--text);font-family:Montserrat,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 22px}.top{min-height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(197,161,90,.2)}.top img{width:58px;height:58px;object-fit:contain}.top a{color:var(--gold);text-decoration:none;font-weight:700}.hero{padding:88px 0 55px;text-align:center}.hero small{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-weight:700}.hero h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,8vw,6rem);margin:10px 0 12px}.hero p{max-width:700px;margin:auto;color:rgba(247,243,237,.68)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:90px}.card{background:linear-gradient(180deg,#181818,#101010);border:1px solid rgba(197,161,90,.28);border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.body{padding:22px}.body small{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-weight:700}.body h2{font-family:'Playfair Display',serif;font-size:1.7rem;margin:8px 0}.body p{color:rgba(247,243,237,.58);font-size:.92rem}.note{text-align:center;color:rgba(247,243,237,.45);padding:0 0 70px}.back{display:inline-flex;padding:14px 20px;border:1px solid var(--gold);border-radius:8px}@media(max-width:820px){.grid{grid-template-columns:1fr}.hero{padding-top:60px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a href="/"><img src="../images/logo-as.png" alt="Ailton Souza"></a><a class="back" href="/">← Voltar ao site</a></header>
<section class="hero"><small>Minha música</small><h1>Discografia</h1><p>Página criada para reunir os lançamentos de Ailton Souza. Nesta prévia, as capas e informações ainda são temporárias.</p></section>
<main class="grid">
<article class="card"><img src="../images/discografia-quando-chega-o-fim.svg" alt="Capa provisória de Quando Chega o Fim"><div class="body"><small>Prévia visual</small><h2>Quando Chega o Fim</h2><p>Informações e links oficiais serão adicionados depois.</p></div></article>
<article class="card"><img src="../images/discografia-na-rua-de-casa.svg" alt="Capa provisória de Na Rua de Casa"><div class="body"><small>Prévia visual</small><h2>Na Rua de Casa</h2><p>Informações e links oficiais serão adicionados depois.</p></div></article>
<article class="card"><img src="../images/discografia-solidao.svg" alt="Capa provisória de Solidão"><div class="body"><small>Prévia visual</small><h2>Solidão</h2><p>Informações e links oficiais serão adicionados depois.</p></div></article>
</main>
<p class="note">Capas temporárias somente para avaliação do layout.</p>
</div>
</body>
</html>'''
          Path('discografia/index.html').write_text(page, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discografia/index.html images/discografia-*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add discography preview section and page"
          git push
