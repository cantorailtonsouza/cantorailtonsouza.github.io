const pages=[["PROPOSTA EXCLUSIVA • 18.09.2027","A música da sua recepção","Uma experiência musical preparada especialmente para o casamento no Solar Catarina.","CAPA"],["A EXPERIÊNCIA","Uma recepção para guardar na memória","O encontro dos convidados merece uma trilha sonora acolhedora, elegante e cheia de personalidade.","EDITORIAL"],["O ARTISTA","Ailton Souza","Voz, violão e repertório envolvente para criar a atmosfera perfeita na recepção do seu casamento.","EDITORIAL"],["A RECEPÇÃO","O começo de uma celebração inesquecível","Música ao vivo para receber os convidados com leveza, emoção e um repertório pensado para o clima da festa.","EDITORIAL"],["NOSSO DIFERENCIAL","Uma atmosfera feita para vocês","Uma apresentação próxima e elegante, com atenção ao repertório e à experiência dos convidados.","EDITORIAL"],["MOMENTOS REAIS","Histórias que ganham trilha sonora","Conheça um pouco da experiência musical de Ailton Souza em apresentações e celebrações.","GALERIA"],["INVESTIMENTO","Recepção com voz e violão","Recepção musical · R$ 1.200,00|Sonorização inclusa · Sem custo adicional|Data: 18/09/2027 · Solar Catarina","FORMATOS"],["VAMOS CELEBRAR","Sua recepção merece uma trilha especial","Proposta para recepção do casamento em 18 de setembro de 2027, no Solar Catarina. Cerimônia não inclusa.","FINAL"]];const photos=["https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/shows/shows-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/voz-violao/voz-violao-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-02.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/banda/banda-ailton-souza-02.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-03.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/banda/banda-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-04.webp"];const base=document.getElementById('pages');function render(){base.innerHTML='';pages.forEach((d,i)=>{const section=document.createElement('section');section.className='page '+(i===0?'cover ':i===5?'gallery ':i===6?'formats ':i===7?'final ':([1,2,4].includes(i)?'light ':'') );const image='<img class="photo-bg" src="'+photos[i]+'" alt="Fotografia de Ailton Souza" loading="eager">';const portrait=section.classList.contains('light')?'<img class="portrait" src="'+photos[i]+'" alt="Ailton Souza em apresentação" loading="eager">':'';let content='';if(i===0)content='<p id="capa-personalizada"></p>';else if(i===6)content='<div class="offers">'+d[2].split('|').map(x=>{const a=x.split(' · ');return '<div class="offer"><strong>'+a[0]+'</strong><span>'+(a[1]||'')+'</span></div>'}).join('')+'</div>';else content='<p>'+d[2]+'</p>';if(i===5)content+='<div class="photo-pair"><img src="https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-01.webp" alt="Casamento com Ailton Souza"><img src="https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-04.webp" alt="Apresentação em casamento"></div>';if(i===6)content+='<p class="scope-note">Serviço exclusivo para a recepção dos convidados. A apresentação durante a cerimônia não faz parte desta proposta.</p>';if(i===7)content+='<div class="social-links"><a class="cta" href="https://www.youtube.com/@AiltonSouza" target="_blank" rel="noopener">▶ Conheça meu canal no YouTube</a><a class="social-link" href="https://www.instagram.com/cantorailtonsouza/" target="_blank" rel="noopener">Instagram @cantorailtonsouza</a><a class="social-link" href="https://ailtonsouza.com.br/" target="_blank" rel="noopener">ailtonsouza.com.br</a><a class="social-link" href="https://wa.me/5561995840847" target="_blank" rel="noopener">Solicitar disponibilidade no WhatsApp</a></div>';section.innerHTML=image+'<div class="shade"></div>'+portrait+'<div class="inner-frame"></div><div class="body"><span class="eyebrow">'+d[0]+'</span><div class="ornament"></div><h1>'+d[1]+'</h1>'+content+'<footer class="footer"><span>AILTON SOUZA · WEDDING EXPERIENCE</span><span>'+String(i+1).padStart(2,'0')+' / 08</span></footer></div>';base.appendChild(section)});updateName()}function updateName(){const n=document.getElementById('cliente').value.trim();document.getElementById('capa-personalizada').textContent=n?'Uma experiência musical preparada especialmente para '+n+'.':'Uma experiência musical preparada especialmente para o seu grande dia.'}document.getElementById('cliente').addEventListener('input',updateName);render();
</script></body></html>
