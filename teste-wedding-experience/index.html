const pages=[["WEDDING EXPERIENCE","A música do seu grande dia","Uma experiência musical preparada especialmente para","CAPA"],["A EXPERIÊNCIA","Para momentos que merecem ser eternos","O som certo transforma uma celebração em memória. Uma proposta pensada para emocionar, acolher e surpreender.","EDITORIAL"],["O ARTISTA","Ailton Souza","Uma interpretação próxima, um repertório envolvente e a presença de quem entende que cada casamento tem sua própria história.","EDITORIAL"],["A CELEBRAÇÃO","Do primeiro encontro à última dança","A música acompanha o ritmo da festa: recepção elegante, momentos emocionantes e uma pista cheia de energia.","EDITORIAL"],["NOSSO DIFERENCIAL","Mais que um show. Uma atmosfera.","Repertório alinhado ao perfil dos noivos, sensibilidade em cada momento e uma apresentação feita para conectar pessoas.","EDITORIAL"],["MOMENTOS REAIS","Memórias que ganham trilha sonora","Um pouco da emoção que acontece quando música e celebração se encontram.","GALERIA"],["FORMATOS","A experiência certa para o seu casamento","Acústico — voz e violão · R$ 1.200|Banda reduzida · R$ 3.800 (sem som)|Banda completa · R$ 4.800 (sem som)","FORMATOS"],["PRÓXIMO CAPÍTULO","A sua história merece uma trilha inesquecível","Vamos conversar sobre a data, o estilo da celebração e os detalhes que tornam esse dia único.","FINAL"]];const photos=["https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/shows/shows-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/voz-violao/voz-violao-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-02.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/banda/banda-ailton-souza-02.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-03.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/banda/banda-ailton-souza-01.webp","https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-04.webp"];const base=document.getElementById('pages');function addTestimonials(number, total) {
  const section = document.createElement('section');
  section.className = 'page testimonials';
  section.innerHTML = `
    <div class="inner-frame"></div>
    <div class="body">
      <span class="eyebrow">Depoimentos</span>
      <div class="ornament"></div>
      <h1>O que dizem os casais</h1>
      <blockquote class="review">
        <span class="rating" aria-label="5 de 5 estrelas">★★★★★</span>
        <p>“Ele cantou no meu casamento foi incrível, grande profissional”</p>
        <cite>Gradienilson</cite>
      </blockquote>
      <blockquote class="review">
        <span class="rating" aria-label="5 de 5 estrelas">★★★★★</span>
        <p>“Um excelente profissional e uma excelente pessoa. Vale muito a pena contratar.”</p>
        <cite>Suzana</cite>
      </blockquote>
      <blockquote class="review">
        <p>“Foi maravilhoso!”</p>
        <cite>Natalia Pires</cite>
      </blockquote>
      <a class="review-source" href="https://www.casamentos.com.br/musica-de-casamento/ailton-souza-cantor--e307674" target="_blank" rel="noopener">Leia as avaliações no Casamentos.com.br</a>
      <footer class="footer"><span>AILTON SOUZA · WEDDING EXPERIENCE</span><span>${number} / ${total}</span></footer>
    </div>`;
  base.appendChild(section);
}
function render(){base.innerHTML='';const total=String(pages.length+1).padStart(2,'0');pages.forEach((d,i)=>{const isFinal=d[3]==='FINAL';if(isFinal)addTestimonials(String(i+1).padStart(2,'0'),total);const section=document.createElement('section');section.className='page '+(i===0?'cover ':i===5?'gallery ':i===6?'formats ':i===7?'final ':([1,2,4].includes(i)?'light ':'') );const image='<img class="photo-bg" src="'+photos[i]+'" alt="Fotografia de Ailton Souza" loading="eager">';const portrait=section.classList.contains('light')?'<img class="portrait" src="'+photos[i]+'" alt="Ailton Souza em apresentação" loading="eager">':'';let content='';if(i===0)content='<p id="capa-personalizada"></p><p class="event-detail" data-event-info></p>';else if(i===6)content='<div class="offers">'+d[2].split('|').map(x=>{const a=x.split(' · ');return '<div class="offer"><strong>'+a[0]+'</strong><span>'+(a[1]||'')+'</span></div>'}).join('')+'</div>';else content='<p>'+d[2]+'</p>';if(i===5)content+='<div class="photo-pair"><img src="https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-01.webp" alt="Casamento com Ailton Souza"><img src="https://raw.githubusercontent.com/cantorailtonsouza/cantorailtonsouza.github.io/main/images/galeria/casamentos/casamento-ailton-souza-04.webp" alt="Apresentação em casamento"></div>';if(i===6||i===7)content+='<p class="event-detail" data-event-info></p>';if(i===6)content+='<p class="event-detail" id="sound-quote">Banda completa + sonorização: R$ 6.500 a R$ 8.000 (estimativa conforme local e estrutura).</p>';if(i===7)content+='<div class="social-links"><a class="cta youtube-cta" href="https://www.youtube.com/@AiltonSouza" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/youtube/FF0000" alt="" class="youtube-logo"> Conheça meu canal no YouTube</a><a class="social-link" href="https://www.instagram.com/cantorailtonsouza/" target="_blank" rel="noopener">Instagram @cantorailtonsouza</a><a class="social-link" href="https://ailtonsouza.com.br/" target="_blank" rel="noopener">ailtonsouza.com.br</a><a class="social-link" href="https://wa.me/5561995840847" target="_blank" rel="noopener">Solicitar disponibilidade no WhatsApp</a></div>';section.innerHTML=image+'<div class="shade"></div>'+portrait+'<div class="inner-frame"></div><div class="body"><span class="eyebrow">'+d[0]+'</span><div class="ornament"></div><h1>'+d[1]+'</h1>'+content+'<footer class="footer"><span>AILTON SOUZA · WEDDING EXPERIENCE</span><span>'+String(i+(isFinal?2:1)).padStart(2,'0')+' / '+total+'</span></footer></div>';base.appendChild(section)});updateName()}function updateName(){const bride=document.getElementById('cliente').value.trim(),groom=document.getElementById('noivo').value.trim(),venue=document.getElementById('local').value.trim(),date=document.getElementById('data').value;const names=[bride,groom].filter(Boolean).join(' e ');document.getElementById('capa-personalizada').textContent=names?'Uma experiência musical preparada especialmente para '+names+'.':'Uma experiência musical preparada especialmente para o seu grande dia.';let dateLabel='';if(date){const a=date.split('-');dateLabel=a[2]+'/'+a[1]+'/'+a[0]}const details=[names?('Casamento de '+names):'',venue?('Local: '+venue):'',dateLabel?('Data: '+dateLabel):''].filter(Boolean).join(' · ');document.querySelectorAll('[data-event-info]').forEach(el=>el.textContent=details);const raw=document.getElementById('som-cotado').value;const value=Number(raw);document.getElementById('sound-quote').textContent=raw.trim()!==''&&Number.isFinite(value)&&value>0?'Banda completa + sonorização: '+new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(value)+' (valor cotado para este evento).':'Banda completa + sonorização: R$ 6.500 a R$ 8.000 (estimativa conforme local e estrutura).';}['cliente','noivo','local','data','som-cotado'].forEach(id=>document.getElementById(id).addEventListener('input',updateName));render();
</script></body></html>
